<main id="app"></main>
<script>
// ================= CONFIG =================
var SITE_NAME="Been to Tech";
var LOGO_URL="https://drive.google.com/file/d/1zZ8ry2rTIZn35iPRvAPEIrqsYOv08Q4M/view?usp=sharing"; // Drive file must be shared as "Anyone with the link"
var SHEET_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vScRFwnnxy-oDCxW5yBsyChUcPNJZvbzG7TsUvuF1FNmVNk6rLpemjAx3gF1iuNH1eyX6ZNkXIo-eLF/pub?gid=656534179&single=true&output=csv";   // published CSV link of your Score sheet tab

var ADMIN_HASH="057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86"; // SHA-256 of the admin passcode (default passcode: changeme)
// ==========================================
// ---------- Scoring rules (from the Criteria sheet) ----------
var W={chipset:.25,storage:.15,display:.2,battery:.2,value:.2};
var PANELS={"LTPO OLED / premium OLED":5,"OLED / AMOLED":4,"High-quality IPS LCD":3,"Basic IPS LCD":2,"TN / very basic LCD":1};
var RES={"QHD+ or higher":5,"High-quality 1.5K":4.5,"1080p / FHD+":4,"720p / HD+":2,"Below 720p":1};
var STYPE={"UFS 4.x":1,"UFS 3.x":.5,"UFS 2.2":0,"eMMC":-.5};
var DEALS={5:"Great deal",4:"Good deal",3:"Fair/good deal",2:"Poor deal",1:"Terrible deal"};
function tier(v,t){for(var i=0;i<t.length;i++)if(v>=t[i][0])return t[i][1];return t[t.length-1][1]}
function score(m){var ov=m.ov||{};
  var chip=ov.chipset||tier(m.antutu,[[1500000,5],[1000000,4],[600000,3],[300000,2],[0,1]]);
  var base=m.storage>=512?5:m.storage>=256?4:m.storage>=128?3:m.storage>=64?2:1;
  var stor=ov.storage||Math.min(5,base+(STYPE[m.stype]||0));
  var d=[tier(m.hz,[[120,5],[90,4],[60,3],[0,2]]),PANELS[m.panel]||1,RES[m.res]||1,
    tier(m.nits,[[3000,5],[2000,4.5],[1000,4],[600,3],[400,2],[0,1]])];
  var disp=ov.display||d.reduce(function(a,b){return a+b},0)/4;
  var b=[tier(m.mah,[[7000,5],[6000,4.5],[5000,4],[4000,3],[3000,2],[0,1]]),
    tier(m.watt,[[100,5],[67,4],[45,3],[25,2],[0,1]])];
  var batt=ov.battery||(b[0]+b[1])/2;
  var val=m.value;
  var fin=ov.final||Math.min(5,chip*W.chipset+stor*W.storage+disp*W.display+batt*W.battery+val*W.value);
  return {chipset:chip,storage:stor,display:disp,battery:batt,value:val,final:fin,d:m.dd||d,b:m.bb||b,base:base};
}
function meaning(s){return s>=5?["Exceptional","Top-tier / best-in-class for its category"]:s>=4?["Excellent","Clearly above average"]:s>=3?["Good","Solid, acceptable performance"]:s>=2?["Below Average","Noticeable compromises"]:["Poor","Weak by current standards"]}
// ---------- Data ----------
var SEED=[
{id:"s1",brand:"Infinix",name:"HOT 70",chipset:"MediaTek Helio G100",antutu:575630,storage:256,stype:"UFS 2.2",hz:120,panel:"Basic IPS LCD",res:"720p / HD+",nits:700,mah:6000,watt:45,price:8999,value:3,features:["Massive 6,000mAh Battery with Bypass Charging","One-Tap AI shortcut button","Thermo-Reactive Color Changing Design"]},
{id:"s2",brand:"Infinix",name:"HOT 70 Pro",chipset:"MediaTek Dimensity 7100",antutu:785352,storage:256,stype:"UFS 2.2",hz:144,panel:"Basic IPS LCD",res:"1080p / FHD+",nits:950,mah:6000,watt:45,price:11999,value:3,features:["Flagship-Tier 144Hz Full HD+ LTPS display","Military-Grade Toughness & True IP68","\"Active Matrix Cube\" LED Back Panel"]},
{id:"s3",brand:"Vivo",name:"Y05",chipset:"Unisoc T7225",antutu:252597,storage:128,stype:"eMMC",hz:120,panel:"Basic IPS LCD",res:"720p / HD+",nits:1200,mah:6500,watt:15,price:5999,value:1,features:["Massive 6,500mAh BlueVolt Battery","SGS 5-Star Drop Resistance","120Hz Sunlight Screen with 1,200 Nits Peak Brightness"]},
{id:"s4",brand:"TECNO",name:"CAMON Slim 5G",chipset:"MediaTek Dimensity 7300e",antutu:831785,storage:256,stype:"UFS 2.2",hz:144,panel:"OLED / AMOLED",res:"High-quality 1.5K",nits:1600,mah:6000,watt:45,price:24999,value:2,features:["1.5K resolution, 144Hz AMOLED display","Maximum Durability Rating (IP69K, IP69, IP68, IP66)","Flagship 144Hz AMOLED Display & Sony LYTIA Camera"]}
];
var models=SEED.slice(),isAdmin=false,notice="";
function parseCSV(t){var r=[],row=[],c="",q=false;for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(c);r.push(row);row=[];c=""}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}
function pick(obj,v,def){var l=String(v).toLowerCase().trim();for(var k in obj)if(k.toLowerCase()===l)return k;return def}
function fromRows(rows){
  // Reads your "Score" tab: the header row starts with "Model". Extra columns you insert (like Image) are detected automatically.
  var hi=-1;for(var i=0;i<rows.length;i++)if((rows[i][0]||"").trim().toLowerCase()==="model"){hi=i;break}
  if(hi<0)return [];
  var H=rows[hi].map(function(h){return h.toLowerCase().replace(/[^a-z0-9]/g,"")});
  var iImg=H.indexOf("image"),iBr=H.indexOf("brand"),fi=H.indexOf("finalrating"),sh=fi>0?fi-6:(iImg>0&&iImg<7?1:0);window.__info="sheet loaded · column shift "+sh+" · image column "+(iImg<0?"NOT found":"found");
  function P(i){return i<1?i:i+sh}
  function c(r,i){return i<0?"":String(r[i]||"").replace(/\t/g," ").trim()}
  function n(r,i){var v=parseFloat(c(r,P(i)).replace(/,/g,""));return isNaN(v)?undefined:v}
  function arr(r,a){var o=a.map(function(i){return n(r,i)});return o.every(function(x){return x!==undefined})?o:null}
  return rows.slice(hi+1).filter(function(r){return c(r,0)}).map(function(r){
    var full=c(r,0),br=c(r,iBr),b,nm;
    if(br){b=br;nm=full.toLowerCase().indexOf(br.toLowerCase())===0?full.slice(br.length).trim():full}
    else{var sp=full.indexOf(" ");b=sp<0?full:full.slice(0,sp);nm=sp<0?full:full.slice(sp+1).trim()}
    return {id:(b+"-"+nm).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),brand:b,name:nm||full,chipset:c(r,P(7))||"—",antutu:n(r,8)||0,storage:n(r,10)||0,stype:c(r,P(11)),hz:n(r,15)||0,panel:c(r,P(16)),res:c(r,P(17)),nits:n(r,18)||0,mah:n(r,24)||0,watt:n(r,25)||0,price:n(r,30)||0,value:n(r,32)||n(r,5)||3,deal:c(r,P(29)),img:c(r,iImg),
      features:c(r,P(31)).split(/\n/).map(function(x){return x.replace(/^[>\-\s]+/,"").trim()}).filter(Boolean),
      dd:arr(r,[19,20,21,22]),bb:arr(r,[26,27]),ov:{chipset:n(r,1),storage:n(r,2),display:n(r,3),battery:n(r,4),final:n(r,6)}};
  });
}
function needSheet(){if(!SHEET_EDIT_URL){alert("Set SHEET_EDIT_URL at the top of the HTML file to your Google Sheet's edit link.");return false}return true}
function driveImg(u){if(!u)return "";u=u.trim();var gh=u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);if(gh)return "https://raw.githubusercontent.com/"+gh[1]+"/"+gh[2]+"/"+gh[3].split("?")[0];var m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1000":u}
function imgErr(i){var d=document.createElement("div");d.className=i.className+" ph";d.textContent="📱";i.replaceWith(d)}
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function toggleAdmin(){if(isAdmin){isAdmin=false;return route()}var p=prompt("Admin passcode:");if(p===null)return;try{if(await sha(p)===ADMIN_HASH){isAdmin=true;route()}else alert("Wrong passcode.")}catch(e){alert("Admin unlock needs https.")}}
async function initRT(){
  if(SHEET_CSV_URL){try{var r=await fetch(SHEET_CSV_URL,{cache:"no-store"});if(!r.ok)throw 0;var m=fromRows(parseCSV(await r.text()));if(m.length){models=m;notice=""}else notice="The sheet has no rows yet. Showing sample data."}catch(e){notice="Couldn't load the Google Sheet. Showing sample data."}}
  else notice="Demo data. Set SHEET_CSV_URL in the file to connect your Google Sheet.";

// ---------- Helpers ----------
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function f(n){return (Math.round(n*100)/100).toFixed(2)}
function peso(n){return "₱"+Number(n).toLocaleString()}
var app=document.getElementById("app");
function opts(obj,sel){return Object.keys(obj).map(function(k){return '<option'+(k===sel?' selected':'')+'>'+esc(k)+'</option>'}).join("")}
// ---------- Pages ----------
var filt="All";
function thumb(m,c){var u=driveImg(m.img);return u?'<img class="'+c+'" src="'+esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgErr(this)">':'<div class="'+c+' ph">📱</div>'}
var F={q:"",price:[],ant:[],star:[]};var fOpen=window.innerWidth>780;
var PR=[["₱5,000 and less",function(v){return v<=5000}],["₱5,000 – 10,000",function(v){return v>5000&&v<=10000}],["₱10,000 – 15,000",function(v){return v>10000&&v<=15000}],["₱15,000 – 20,000",function(v){return v>15000&&v<=20000}],["₱20,000 – 30,000",function(v){return v>20000&&v<30000}],["₱30,000 or higher",function(v){return v>=30000}]];
var AN=[["1,500,000+",function(v){return v>=1500000}],["1,000,000 – 1,499,999",function(v){return v>=1000000&&v<1500000}],["600,000 – 999,999",function(v){return v>=600000&&v<1000000}],["300,000 – 599,999",function(v){return v>=300000&&v<600000}],["Below 300,000",function(v){return v<300000}]];
var SR=[["★★★★★ 5 · Exceptional",function(v){return v>=5}],["★★★★ 4 – 4.99 · Excellent",function(v){return v>=4&&v<5}],["★★★ 3 – 3.99 · Good",function(v){return v>=3&&v<4}],["★★ 2 – 2.99 · Below Average",function(v){return v>=2&&v<3}],["★ Below 2 · Poor",function(v){return v<2}]];
function pass(m){
  var q=F.q.toLowerCase().trim();
  if(q&&(m.brand+" "+m.name+" "+m.chipset).toLowerCase().indexOf(q)<0)return false;
  function any(sel,T,v){return !sel.length||sel.some(function(i){return T[i][1](v)})}
  return any(F.price,PR,m.price)&&any(F.ant,AN,m.antutu)&&any(F.star,SR,score(m).final);
}
function group(title,key,T){return '<div class="fg"><h4>'+title+'</h4>'+T.map(function(t,i){return '<label class="ck"><input type="checkbox" data-k="'+key+'" value="'+i+'"'+(F[key].indexOf(i)>-1?' checked':'')+'> '+t[0]+'</label>'}).join("")+'</div>'}
function renderRes(){
  var list=models.filter(pass),brands={};
  list.forEach(function(m){(brands[m.brand]=brands[m.brand]||[]).push(m)});
  var all=Array.from(new Set(models.map(function(m){return m.brand}))).sort();
  if(filt!=="All"&&all.indexOf(filt)<0)filt="All";
  var h='<div class="chips">'+["All"].concat(all).map(function(n){return '<button class="fc'+(n===filt?' on':'')+'" data-b="'+esc(n)+'">'+esc(n)+'</button>'}).join("")+'</div><div class="mu" style="margin:2px 0 6px">'+list.length+' of '+models.length+' models</div>';
  Object.keys(brands).sort().filter(function(n){return filt==="All"||n===filt}).forEach(function(b){
    h+='<div class="bh"><div class="av">'+esc(b.charAt(0).toUpperCase())+'</div><h2>'+esc(b)+' <span class="mu" style="font-weight:400">· '+brands[b].length+'</span></h2></div><div class="pg">';
    brands[b].forEach(function(m){var s=score(m);h+='<div class="pc" onclick="location.hash=\'#/model/'+m.id+'\'">'+thumb(m,'th')+'<div class="pb"><b>'+esc(m.name)+'</b><div class="mu" style="font-size:13px">'+peso(m.price)+'</div><div style="margin-top:6px"><span class="chip">★ '+f(s.final)+'</span> <span class="mu" style="font-size:12px">'+meaning(s.final)[0]+'</span></div></div></div>'});
    h+='</div>';
  });
  if(!list.length)h+='<div class="card mu">No phones match these filters.</div>';
  var el=document.getElementById("res");el.innerHTML=h;
  el.querySelectorAll(".fc").forEach(function(b){b.onclick=function(){filt=b.getAttribute("data-b");renderRes()}});
}
function heroHTML(){return '<section class="hero"><div class="kick">BEEN TO TECH • PHONE SCORES</div><h1>Honest Phone Ratings<span>by Been to Tech</span></h1><div class="dv"></div><p>Chipset, storage, display, battery and value, scored out of 5.</p></section>'}
function home(){
  var brandCount=new Set(models.map(function(m){return m.brand})).size;
  var best=models.slice().sort(function(a,b){return score(b).final-score(a).final})[0];
  var h='<section class="bn"><img src="banner.jpg" alt="Honest Phone Ratings by Been to Tech. Chipset, storage, display, battery and value, scored out of 5." onerror="this.parentNode.outerHTML=heroHTML()"><h1 class="sr">Honest Phone Ratings by Been to Tech</h1></section>';
  if(notice)h+='<div class="card mu" style="font-size:13px">'+esc(notice)+'</div>';
  h+='<div class="lay'+(fOpen?'':' fh')+'" id="lay"><div class="ov" id="ov"></div><aside class="side card"><div class="sh"><b>Filters</b><button class="x" id="hide">‹ Hide</button></div><div class="fg"><h4>Model</h4><input id="q" placeholder="Search model, brand or chipset" value="'+esc(F.q)+'"></div>'+group("Price range","price",PR)+group("AnTuTu rating","ant",AN)+group("Star rating","star",SR)+'<div class="fg"><button class="btn" id="clr">Clear filters</button></div></aside><div class="main"><div class="tbar"><button class="btn" id="tf">☰ Filters</button></div><div id="res"></div></div></div><p class="mu" style="text-align:center;font-size:12px;margin:28px 0 0">Been to Tech · page version 2026.10.16-12 · '+esc(window.__info||"demo data (sheet not loaded)")+'</p>';
  app.innerHTML=h;
  var side=app.querySelector(".side");
  side.addEventListener("change",function(e){var t=e.target,k=t.getAttribute("data-k");if(!k)return;var a=F[k],v=+t.value,i=a.indexOf(v);if(t.checked&&i<0)a.push(v);if(!t.checked&&i>-1)a.splice(i,1);renderRes()});
  document.getElementById("q").addEventListener("input",function(e){F.q=e.target.value;renderRes()});
  function setF(o){fOpen=o;document.getElementById("lay").classList.toggle("fh",!o)}
  document.getElementById("hide").onclick=function(){setF(false)};document.getElementById("tf").onclick=function(){setF(!fOpen)};document.getElementById("ov").onclick=function(){setF(false)};
  document.getElementById("clr").onclick=function(){F={q:"",price:[],ant:[],star:[]};filt="All";home()};
  renderRes();
}
function model(id){
  var m=models.filter(function(x){return x.id===id})[0];
  if(!m){location.hash="#/";return}
  var s=score(m),mn=meaning(s.final);
  var cats=[["⚡ Chipset",s.chipset,W.chipset,m.chipset+" · AnTuTu "+m.antutu.toLocaleString()],
    ["💾 Storage",s.storage,W.storage,m.storage+"GB "+m.stype],
    ["🖥️ Display",s.display,W.display,m.hz+"Hz · "+m.panel+" · "+m.res+" · "+m.nits+" nits"],
    ["🔋 Battery",s.battery,W.battery,m.mah.toLocaleString()+"mAh · "+m.watt+"W wired"],
    ["💰 Value",s.value,W.value,peso(m.price)+" · "+(m.deal||DEALS[m.value])]];
  var h='<p><a href="#/">← All phones</a></p>'+'<div class="card tcard"><div class="mu">'+esc(m.brand)+'</div><h1>'+esc(m.name)+'</h1></div>'+
        '<h3>Score breakdown</h3><div class="mrow"><div class="mimgw">'+thumb(m,'mimg')+'</div><div class="card" style="margin:0">';
  var P=cats.map(function(c){return c[1]});
  function pt(i,r){var a=(-90+i*72)*Math.PI/180;return [150+r*Math.cos(a),150+r*Math.sin(a)]}
  function pts(r){return cats.map(function(_,i){return pt(i,typeof r==="function"?r(i):r).map(function(x){return x.toFixed(1)}).join(",")}).join(" ")}
  function colr(v){return v>=4.5?"#10b981":v>=3.5?"#3b82f6":v>=2.5?"#f59e0b":v>=1.5?"#f97316":"#ef4444"}
  var sv='<svg viewBox="-40 0 380 300" class="rd" role="img" aria-label="Score radar chart">';
  [1,2,3,4,5].forEach(function(l){sv+='<polygon points="'+pts(l*20)+'" fill="none" style="stroke:var(--bd)" stroke-width="1"/>'});
  cats.forEach(function(_,i){var p=pt(i,100);sv+='<line x1="150" y1="150" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" style="stroke:var(--bd)"/>'});
  sv+='<polygon points="'+pts(function(i){return P[i]*20})+'" style="fill:var(--ac);fill-opacity:.25;stroke:var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>';
  cats.forEach(function(c,i){var d=pt(i,P[i]*20),l=pt(i,124),an=l[0]<140?"end":l[0]>160?"start":"middle";
    sv+='<circle cx="'+d[0].toFixed(1)+'" cy="'+d[1].toFixed(1)+'" r="4.5" fill="'+colr(P[i])+'" stroke="#fff" stroke-width="1.5"/><text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="'+an+'" font-size="13" font-weight="600" style="fill:var(--tx)">'+c[0].replace(/^\S+\s/,"")+'</text>'});
  sv+='</svg>';
  h+='<div class="sbw"><div><div class="card sc"><div class="big">'+f(s.final)+'<span class="mu" style="font-size:18px;font-weight:500"> / 5</span></div><div><b>'+mn[0]+'</b> <span class="mu">— '+mn[1]+'</span></div></div>'+'<div class="rw">'+sv+'</div></div><div class="tiles">';
  cats.forEach(function(c){h+='<div class="tile"><div class="rg" style="--p:'+(c[1]/5*100)+';--c:'+colr(c[1])+'"><b>'+f(c[1])+'</b></div><div style="min-width:0"><div class="tt">'+c[0]+' <span class="mu" style="font-weight:500">· '+Math.round(c[2]*100)+'% weight</span></div><div class="mu td">'+esc(c[3])+'</div><div class="td" style="color:'+colr(c[1])+';font-weight:600">+'+f(c[1]*c[2])+' pts to final score</div></div></div>'});
  h+='</div></div>';
  h+='</div></div>'+
    '<h3>Key features</h3><div class="card"><ul class="f">'+(m.features.length?m.features.map(function(x){return '<li>'+esc(x)+'</li>'}).join(""):'<li class="mu">None listed</li>')+'</ul></div>'+
    (isAdmin&&SHEET_EDIT_URL?'<p><a class="btn" target="_blank" rel="noopener" href="'+esc(SHEET_EDIT_URL)+'">Edit this phone in Google Sheet</a></p>':'');
  app.innerHTML=h;
  
}
// ---------- Router ----------
function route(){
  var p=location.hash.replace(/^#\/?/,"").split("/");
  var clone=app.cloneNode(false);app.parentNode.replaceChild(clone,app);app=clone;app.className=(!p[0]||p[0]==="model")?"wide":""; // drops stale listeners
  if(p[0]==="model")model(p[1]);else home();
  window.scrollTo(0,0);
}
(function(){document.title=SITE_NAME+" · Phone Scores";var u=driveImg(LOGO_URL);if(u){var l=document.createElement("link");l.rel="icon";l.href=u;document.head.appendChild(l)}})();
window.addEventListener("hashchange",route);route();initRT();
</script>
</body>
</html>
